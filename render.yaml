services:
  - type: web
    name: codementor-ai-backend
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: feat/phase4-adaptive-learning-flow-premium-ui
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      # Production code execution (Judge0 CE via dedicated VPS `auth_token` or RapidAPI `rapidapi`)
      # Set JUDGE0_BASE_URL + JUDGE0_AUTH_TOKEN (or JUDGE0_RAPIDAPI_KEY) in Render Dashboard -> Environment.
      # To boot temporarily without Judge0 while keeping auth/lessons/diagnostics active, set JUDGE0_AUTH_MODE=disabled.
      - key: JUDGE0_AUTH_MODE
        value: auto
      - key: JUDGE0_BASE_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
      - key: JUDGE0_RAPIDAPI_HOST
        value: judge0-ce.p.rapidapi.com
      # Piston fallback MUST stay disabled in production unless hosted on a dedicated isolated VM/microVM
      - key: EXECUTION_FALLBACK_ENABLED
        value: "false"
      - key: PISTON_ENABLED
        value: "false"
      - key: PISTON_ISOLATED_HOST_VERIFIED
        value: "false"
      # Bundled scikit-learn ML error classifier artifact
      - key: ML_MODEL_ARTIFACT_PATH
        value: /app/ml/artifacts/error_classifier_v1.joblib
      # Socratic AI Mentor (Gemini API; falls back deterministically if LLM_API_KEY is omitted)
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
