services:
  - type: web
    name: codementor-ai-backend
    runtime: docker
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: develop
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      # Production code execution:
      # Supported modes: `worker_queue` (free outbound local Windows Judge0 runner), `auth_token` (VPS), `rapidapi`, or `disabled`.
      - key: JUDGE0_AUTH_MODE
        sync: false
      - key: EXECUTION_WORKER_TOKEN
        sync: false
      - key: EXECUTION_ALLOWED_EMAILS
        sync: false
      - key: JUDGE0_BASE_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: JUDGE0_RAPIDAPI_KEY
        sync: false
      - key: JUDGE0_RAPIDAPI_HOST
        value: judge0-ce.p.rapidapi.com
      # Piston fallback MUST stay disabled in production unless hosted on a dedicated isolated VM/microVM
      - key: EXECUTION_FALLBACK_ENABLED
        value: "false"
      - key: PISTON_ENABLED
        value: "false"
      - key: PISTON_ISOLATED_HOST_VERIFIED
        value: "false"
      # Bundled scikit-learn ML error classifier artifact & verified RAG threshold
      - key: ML_MODEL_ARTIFACT_PATH
        value: /app/ml/artifacts/error_classifier_v1.joblib
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.22"
      # Socratic AI Mentor (Gemini API; falls back deterministically if LLM_API_KEY is omitted)
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Reverse-proxy IP extraction: set TRUSTED_PROXY_CIDRS explicitly for verified edge proxies
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
