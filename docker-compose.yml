services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: think_first_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codementor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codementor_dev}
      POSTGRES_DB: ${POSTGRES_DB:-codementor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codementor} -d ${POSTGRES_DB:-codementor}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: think_first_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codementor}:${POSTGRES_PASSWORD:-codementor_dev}@postgres:5432/${POSTGRES_DB:-codementor}
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: think_first_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # --- Isolated Judge0 CE Execution Plane (activated via `--profile execution` in Phase 3+) ---
  judge0-redis:
    image: redis:7.2-alpine
    profiles: [ "execution" ]
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${JUDGE0_REDIS_PASSWORD:-judge0_dev_redis}" ]
    volumes:
      - judge0_redis_data:/data

  judge0-db:
    image: postgres:16.2-alpine
    profiles: [ "execution" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_pg}
      POSTGRES_DB: judge0
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data

  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: [ "execution" ]
    restart: unless-stopped
    privileged: true
    mem_limit: 2g
    shm_size: 128m
    pids_limit: 256
    ports:
      - "127.0.0.1:${JUDGE0_HOST_PORT:-2359}:2358"
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0_dev_redis}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_pg}
      AUTHN_HEADER: "X-Auth-Token"
      AUTHN_TOKEN: "${JUDGE0_AUTH_TOKEN:-}"
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_CALLBACKS: "false"
      ENABLE_COMPILER_OPTIONS: "false"
      ENABLE_COMMAND_LINE_ARGUMENTS: "false"
      ENABLE_ADDITIONAL_FILES: "false"
      ENABLE_SUBMISSION_DELETE: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      CPU_TIME_LIMIT: "5"
      MAX_CPU_TIME_LIMIT: "10"
      CPU_EXTRA_TIME: "1"
      MAX_CPU_EXTRA_TIME: "2"
      WALL_TIME_LIMIT: "10"
      MAX_WALL_TIME_LIMIT: "15"
      MEMORY_LIMIT: "4194304"
      MAX_MEMORY_LIMIT: "4194304"
      MAX_PROCESSES_AND_OR_THREADS: "64"
      MAX_MAX_PROCESSES_AND_OR_THREADS: "120"
      MAX_FILE_SIZE: "1024"
      MAX_MAX_FILE_SIZE: "2048"
      MAX_NUMBER_OF_RUNS: "1"
      MAX_QUEUE_SIZE: "50"
    depends_on:
      - judge0-redis
      - judge0-db

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: [ "execution" ]
    restart: unless-stopped
    privileged: true
    mem_limit: 2g
    shm_size: 128m
    pids_limit: 256
    command: [ "./scripts/workers" ]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0_dev_redis}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_dev_pg}
      AUTHN_HEADER: "X-Auth-Token"
      AUTHN_TOKEN: "${JUDGE0_AUTH_TOKEN:-}"
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_CALLBACKS: "false"
      ENABLE_COMPILER_OPTIONS: "false"
      ENABLE_COMMAND_LINE_ARGUMENTS: "false"
      ENABLE_ADDITIONAL_FILES: "false"
      ENABLE_SUBMISSION_DELETE: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      CPU_TIME_LIMIT: "5"
      MAX_CPU_TIME_LIMIT: "10"
      CPU_EXTRA_TIME: "1"
      MAX_CPU_EXTRA_TIME: "2"
      WALL_TIME_LIMIT: "10"
      MAX_WALL_TIME_LIMIT: "15"
      MEMORY_LIMIT: "4194304"
      MAX_MEMORY_LIMIT: "4194304"
      MAX_PROCESSES_AND_OR_THREADS: "64"
      MAX_MAX_PROCESSES_AND_OR_THREADS: "120"
      MAX_FILE_SIZE: "1024"
      MAX_MAX_FILE_SIZE: "2048"
      MAX_NUMBER_OF_RUNS: "1"
      MAX_QUEUE_SIZE: "50"
    depends_on:
      - judge0-redis
      - judge0-db

volumes:
  postgres_data:
  judge0_redis_data:
  judge0_pg_data:
