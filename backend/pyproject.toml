[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codementor-backend"
version = "0.1.0"
description = "CodeMentor AI (Think_First) modular monolith backend API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.2.0",
    "asyncpg>=0.30.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "structlog>=24.4.0,<26.0.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "pandas>=2.2.0,<4.0.0",
    "numpy>=2.0.0,<3.0.0",
    "joblib>=1.4.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.14.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "ml"]

[tool.ruff.lint.per-file-ignores]
"app/integrations/llm/client.py" = ["E501"]
"app/services/mentor/knowledge_corpus.py" = ["E501"]
"app/services/mentor/socratic_agent.py" = ["E501"]
"app/services/verification/service.py" = ["E501"]
"app/services/mentor/rag_service.py" = ["E501"]
"app/services/learning/*.py" = ["E501"]
"app/services/growth/*.py" = ["E501"]
"tests/test_phase4_mentor_rag_and_security.py" = ["E501"]
"tests/test_phase5_learning_and_security.py" = ["E501"]
"tests/test_phase6_growth_and_security.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ".."
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "numpy", "numpy.*", "pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
