# Think_First — Self-Hosted Piston v2 Hardened Local Fallback Execution Engine
#
# SECURITY MODEL & DEPLOYMENT BOUNDARY:
# - Runs WITHOUT `privileged: true`, with `read_only: true`, `cgroup: private`,
#   Docker's default Seccomp profile active, immutable `:ro` runtime packages,
#   `cap_drop: [ALL]`, `pids_limit: 256`, and loopback-only binding (`127.0.0.1:2000`).
# - Each job runs inside IOI `isolate` (UID 60000+, private network/PID/mount/IPC
#   namespaces, per-job cgroup v2 CPU/memory/process/output limits, networking disabled).
# - RESIDUAL RISK WARNING FOR PUBLIC PRODUCTION:
#   Because IOI `isolate` requires `CAP_SYS_ADMIN`, `CAP_NET_ADMIN`, `CAP_SYS_CHROOT`,
#   and setuid-root namespace setup, DO NOT colocate this container with the FastAPI
#   backend or database on a shared multi-tenant public production host.
#   For public production, either disable Piston fallback (`PISTON_ENABLED=false`,
#   `EXECUTION_FALLBACK_ENABLED=false`) or deploy Piston on a dedicated isolated VM /
#   Firecracker microVM / separate execution host and set `PISTON_ISOLATED_HOST_VERIFIED=true`.
# - Image pinned by immutable SHA-256 digest for supply-chain safety.

services:
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: think_first-piston-api
    restart: unless-stopped
    privileged: false
    read_only: true
    cgroup: private
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SYS_RESOURCE
      - NET_ADMIN
    ports:
      - "127.0.0.1:2000:2000"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /run:rw,nosuid,nodev,size=64m
      - /var/local/lib/isolate:rw,exec,size=512m
      - /piston/jobs:exec,rw,nosuid,nodev,size=512m
    volumes:
      - think_first_piston_packages:/piston/packages:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        mount -o remount,rw /sys/fs/cgroup
        cd /sys/fs/cgroup
        mkdir -p isolate
        echo 1 > isolate/cgroup.procs
        echo '+cpuset +cpu +io +memory +pids' > cgroup.subtree_control
        cd isolate
        mkdir -p init
        echo 1 > init/cgroup.procs
        echo '+cpuset +memory' > cgroup.subtree_control
        mkdir -p /run/isolate/locks
        chown piston:piston /piston/jobs
        exec su -- piston -c 'ulimit -n 65536 && node /piston_api/src'
    environment:
      PISTON_LOG_LEVEL: INFO
      PISTON_BIND_ADDRESS: "0.0.0.0:2000"
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_CONCURRENT_JOBS: "16"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_COMPILE_CPU_TIME: "10000"
      PISTON_RUN_MEMORY_LIMIT: "536870912"
      PISTON_COMPILE_MEMORY_LIMIT: "1073741824"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "256"
      PISTON_MAX_FILE_SIZE: "10000000"
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

volumes:
  think_first_piston_packages:
