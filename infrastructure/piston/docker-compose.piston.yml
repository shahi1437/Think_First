# Think_First — Self-Hosted Piston v2 Secure Fallback Execution Engine
# Bound strictly to 127.0.0.1:2000 (private loopback only; never publicly exposed).
# Image pinned by immutable SHA-256 digest for supply-chain safety.

services:
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    container_name: think_first-piston-api
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:2000:2000"
    tmpfs:
      - /piston/jobs:exec,rw,nosuid,nodev,size=512m
    volumes:
      - think_first_piston_packages:/piston/packages
    environment:
      PISTON_LOG_LEVEL: INFO
      PISTON_BIND_ADDRESS: "0.0.0.0:2000"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_CPU_TIME: "3000"
      PISTON_COMPILE_CPU_TIME: "10000"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_OPEN_FILES: "256"
      PISTON_MAX_FILE_SIZE: "10000000"
    mem_limit: 2g
    cpus: 2.0

volumes:
  think_first_piston_packages:
