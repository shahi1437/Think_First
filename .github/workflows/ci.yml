name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-migrations:
    name: Secret Hygiene & SQL Migration Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no protected local bundles or env files are tracked
        run: |
          if git ls-files | grep -E '(\.local\.json$|^\.env$|^backend/\.env$|^frontend/\.env\.local$)'; then
            echo "ERROR: Protected local curriculum bundle or environment file is tracked in Git!"
            exit 1
          fi

      - name: Verify ordered SQL migrations exist
        run: |
          ls -1 supabase/migrations/*.sql | sort
          python3 -c '
          import pathlib, sys
          files = sorted(p.name for p in pathlib.Path("supabase/migrations").glob("*.sql"))
          assert len(files) >= 8, f"Expected >= 8 migrations, found {len(files)}"
          assert len(files) == len(set(f[:14] for f in files)), "Duplicate migration timestamp prefix!"
          print(f"Verified {len(files)} ordered SQL migrations.")
          '

  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Format check (ruff)
        run: ruff format --check app tests scripts

      - name: Static type check (mypy)
        run: mypy app

      - name: Run unit & API tests (pytest)
        run: pytest -v

      - name: Run ML pipeline tests
        working-directory: .
        run: python -m pytest -v ml/tests

  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency vulnerability audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Unit & component tests (Vitest)
        run: npm test

      - name: Production build (Next.js)
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build
